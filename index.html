<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مَرْجِع | قاعدة البيانات القانونية السعودية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            900: '#153E35',
                            950: '#0F2E27',
                            800: '#1C4F44',
                        },
                        gold: {
                            500: '#D4AF37',
                            400: '#E6CA65',
                            650: '#AA8C2C'
                        },
                        cream: '#FAF9F6',
                        paper: '#F4F1EA'
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #FAF9F6; color: #1F2937; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-cream">

    <!-- Header / Navbar -->
    <header class="bg-emerald-950 border-b-2 border-gold-500 shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-12 h-12 rounded-full border-2 border-gold-500 overflow-hidden flex items-center justify-center bg-emerald-900 shadow-md">
                    <svg viewBox="0 0 24 24" class="w-8 h-8 text-gold-400 fill-current" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5zm0 2.18l7 3.82v5c0 4.52-2.98 8.69-7 9.82-4.02-1.13-7-5.3-7-9.82v-5l7-3.82zM11 10h2v6h-2v-6zm0-3h2v2h-2V7z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-gold-400 tracking-wider">مَرْجِع</h1>
                    <p class="text-xs text-emerald-200">قاعدة البيانات القانونية السعودية</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3 space-x-reverse">
                <button onclick="openNewSystemModal()" class="bg-gold-500 hover:bg-gold-400 text-emerald-950 font-bold px-4 py-2 rounded-xl text-sm shadow-md transition">
                    + نظام جديد
                </button>
                <button onclick="openContentModal()" class="bg-emerald-800 hover:bg-emerald-700 text-gold-400 border border-gold-500/40 px-4 py-2 rounded-xl text-sm shadow-md transition">
                    + إضافة مادة وتطوير
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

        <!-- Search Bar -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gold-500/20">
            <div class="relative">
                <input type="text" id="searchInput" oninput="renderAll()" placeholder="ابحث باسم النظام، المبدأ القضائي، نص المادة، أو التعاميم..." class="w-full bg-paper border border-gold-500/30 text-emerald-950 placeholder-emerald-900/40 text-sm rounded-xl px-4 py-3.5 pr-10 focus:outline-none focus:ring-2 focus:ring-gold-500">
                <span class="absolute right-3.5 top-4 text-gold-600">🔍</span>
            </div>
        </div>

        <!-- Dynamic Grouped Content by Field -->
        <div id="groupedSystemsContainer" class="space-y-8">
            <!-- Dynamically Loaded Groups -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-emerald-950 border-t border-gold-500/30 text-emerald-300 py-6 text-center text-xs mt-auto">
        <p>منصة مَرْجِع القانونية © 2026 - نظام إدارة المعلومات القضائية السعودية</p>
    </footer>

    <!-- Modal: New/Edit System -->
    <div id="newSystemModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 border border-gold-500/30 shadow-2xl">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="sysModalTitle" class="font-bold text-emerald-950 text-lg">إضافة نظام أو مجموعة مبادئ جديدة</h3>
                <button onclick="closeNewSystemModal()" class="text-gray-400 hover:text-gray-600">✕</button>
            </div>
            <input type="hidden" id="editSysId" value="">
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-emerald-900 mb-1">اسم النظام أو التصنيف القضائي</label>
                    <input type="text" id="sysName" placeholder="مثال: مبادئ الأحكام الجزائية" class="w-full bg-paper border border-gray-300 rounded-xl px-3 py-2 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-emerald-900 mb-1">المجال الرئيسي</label>
                        <input type="text" id="sysField" placeholder="مثال: القضاء الجزائي..." class="w-full bg-paper border border-gray-300 rounded-xl px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-emerald-900 mb-1">الحالة</label>
                        <select id="sysStatus" class="w-full bg-paper border border-gray-300 rounded-xl px-3 py-2 text-sm">
                            <option value="ساري">ساري</option>
                            <option value="معتمد">معتمد كسابقة قضائية</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="flex justify-end space-x-2 space-x-reverse pt-3 border-t">
                <button onclick="closeNewSystemModal()" class="px-4 py-2 bg-gray-100 text-gray-700 text-sm rounded-xl">إلغاء</button>
                <button onclick="saveSystem()" class="px-4 py-2 bg-gold-500 text-emerald-950 font-bold text-sm rounded-xl">حفظ النظام</button>
            </div>
        </div>
    </div>

    <!-- Modal: Add/Edit Article -->
    <div id="contentModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full p-6 space-y-4 border border-gold-500/30 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="artModalTitle" class="font-bold text-emerald-950 text-lg">إضافة مادة أو سابقة قضائية</h3>
                <button onclick="closeContentModal()" class="text-gray-400 hover:text-gray-600">✕</button>
            </div>
            <input type="hidden" id="editArtIndex" value="">
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-emerald-900 mb-1">اختر النظام أو فرع المبادئ</label>
                    <select id="contentSysId" class="w-full bg-paper border border-gray-300 rounded-xl px-3 py-2 text-sm"></select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-emerald-900 mb-1">رقم المادة أو عنوان المبدأ</label>
                        <input type="text" id="artNumber" placeholder="مثال: المادة 1" class="w-full bg-paper border border-gray-300 rounded-xl px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-emerald-900 mb-1">المواد المرتبطة (اختياري)</label>
                        <input type="text" id="artCrossLinks" placeholder="مثال: المادة 75 من المرافعات" class="w-full bg-paper border border-gray-300 rounded-xl px-3 py-2 text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-emerald-900 mb-1">نص المادة أو قاعدة المبدأ</label>
                    <textarea id="artText" rows="3" placeholder="النص القانوني..." class="w-full bg-paper border border-gray-300 rounded-xl px-3 py-2 text-sm"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 bg-emerald-50/50 p-3 rounded-xl border border-emerald-900/10">
                    <div>
                        <label class="block text-xs font-bold text-emerald-900 mb-1">الشرح القانوني (اختياري)</label>
                        <textarea id="artExplanation" rows="2" placeholder="تفسير الحكم..." class="w-full bg-white border border-gray-300 rounded-xl px-3 py-2 text-sm"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-emerald-900 mb-1">مثال تطبيقي (اختياري)</label>
                        <textarea id="artExample" rows="2" placeholder="مثال واقعي..." class="w-full bg-white border border-gray-300 rounded-xl px-3 py-2 text-sm"></textarea>
                    </div>
                </div>

                <div class="space-y-3 bg-paper p-3 rounded-xl border border-gold-500/20">
                    <div>
                        <label class="block text-xs font-bold text-emerald-900 mb-1">اللائحة والتعاميم (افصلي بـ | للتعدد)</label>
                        <input type="text" id="artCirculars" placeholder="اللائحة | تعميم..." class="w-full bg-white border border-gray-300 rounded-xl px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-emerald-900 mb-1">السوابق القضائية (افصلي بـ | للتعدد)</label>
                        <input type="text" id="artJudgments" placeholder="مبدأ محكمة عليا..." class="w-full bg-white border border-gray-300 rounded-xl px-3 py-2 text-sm">
                    </div>
                </div>
            </div>
            <div class="flex justify-end space-x-2 space-x-reverse pt-3 border-t">
                <button onclick="closeContentModal()" class="px-4 py-2 bg-gray-100 text-gray-700 text-sm rounded-xl">إلغاء</button>
                <button onclick="saveArticle()" class="px-4 py-2 bg-gold-500 text-emerald-950 font-bold text-sm rounded-xl">حفظ المادة</button>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        let db = JSON.parse(localStorage.getItem('marja_master_db')) || [
            {
                id: 1,
                name: "نظام المرافعات الشرعية",
                field: "الإجراءات القضائية والمرافعات",
                status: "ساري",
                articles: [
                    {
                        number: "المادة 75",
                        text: "إذا دفع أحد الأطراف بعدم الاختصاص النوعي وجب على المحكمة أن تفصل فيه بحكم مستقل...",
                        explanation: "قواعد الاختصاص النوعي من النظام العام وتثار في أي مرحلة من مراحل الدعوى.",
                        example: "الدفع بكون النزاع تجارياً أمام محكمة الأحوال الشخصية.",
                        crossLinks: "المادة 16 من نظام المحاكم التجارية",
                        circulars: ["اللائحة التنفيذية لنظام المرافعات"],
                        judgments: ["مبدأ المحكمة العليا: الدفع بعدم الاختصاص يقبل في أي مرحلة"]
                    }
                ]
            }
        ];

        function saveData() {
            localStorage.setItem('marja_master_db', JSON.stringify(db));
            renderAll();
        }

        function renderAll() {
            const container = document.getElementById('groupedSystemsContainer');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            container.innerHTML = '';

            let fieldsMap = {};

            db.forEach(sys => {
                let matchSys = sys.name.toLowerCase().includes(searchVal) || sys.field.toLowerCase().includes(searchVal);
                let filteredArticles = sys.articles.filter((a, idx) => 
                    a.number.toLowerCase().includes(searchVal) || 
                    a.text.toLowerCase().includes(searchVal) || 
                    (a.explanation && a.explanation.toLowerCase().includes(searchVal)) ||
                    (a.example && a.example.toLowerCase().includes(searchVal)) ||
                    (a.crossLinks && a.crossLinks.toLowerCase().includes(searchVal)) ||
                    a.circulars.some(c => c.toLowerCase().includes(searchVal)) ||
                    a.judgments.some(j => j.toLowerCase().includes(searchVal))
                );

                if (matchSys || filteredArticles.length > 0) {
                    if (!fieldsMap[sys.field]) fieldsMap[sys.field] = [];
                    // Keep original indices for editing reference
                    let mappedArticles = sys.articles.map((art, originalIndex) => ({ ...art, originalIndex }));
                    if (!matchSys) {
                        mappedArticles = mappedArticles.filter((_, idx) => filteredArticles.some(fa => sys.articles.indexOf(fa) === idx));
                    }
                    fieldsMap[sys.field].push({ ...sys, displayedArticles: mappedArticles });
                }
            });

            if (Object.keys(fieldsMap).length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-gray-400 bg-white rounded-2xl border border-dashed border-gray-300">لا توجد نتائج مطابقة لبحثك</div>`;
                return;
            }

            for (let field in fieldsMap) {
                let groupWrapper = document.createElement('div');
                groupWrapper.className = 'space-y-4';
                
                let groupHeader = `
                    <div class="flex items-center gap-3 border-b-2 border-gold-500/40 pb-2">
                        <span class="text-lg">📁</span>
                        <h2 class="text-xl font-black text-emerald-950">مجال: ${field}</h2>
                    </div>
                `;

                let systemsGrid = document.createElement('div');
                systemsGrid.className = 'space-y-6 mt-4';

                fieldsMap[field].forEach(sys => {
                    let sysCard = document.createElement('div');
                    sysCard.className = 'bg-white rounded-2xl border border-gold-500/30 shadow-sm p-6 space-y-4';
                    
                    let articlesHTML = '';
                    if (sys.displayedArticles.length === 0) {
                        articlesHTML = `<p class="text-xs text-gray-400 italic">لم تدرج مواد تحت هذا النظام بعد.</p>`;
                    } else {
                        sys.displayedArticles.forEach(art => {
                            articlesHTML += `
                                <div class="bg-paper p-4 rounded-xl border-r-4 border-emerald-800 space-y-3 relative">
                                    <div class="flex justify-between items-center border-b pb-2 border-gold-500/10">
                                        <span class="font-bold text-emerald-950 text-base">📜 ${art.number}</span>
                                        <div class="flex items-center gap-2">
                                            ${art.crossLinks ? `<span class="text-xs bg-gold-500/20 text-emerald-950 px-2.5 py-1 rounded-lg border border-gold-500/30">🔗 ارتباط: ${art.crossLinks}</span>` : ''}
                                            <button onclick="openEditArticleModal(${sys.id}, ${art.originalIndex})" class="text-xs bg-emerald-100 hover:bg-emerald-200 text-emerald-900 px-2 py-1 rounded font-bold">✏️ تعديل</button>
                                            <button onclick="deleteArticle(${sys.id}, ${art.originalIndex})" class="text-xs bg-red-100 hover:bg-red-200 text-red-700 px-2 py-1 rounded font-bold">حذف</button>
                                        </div>
                                    </div>
                                    <p class="text-xs text-gray-800 leading-relaxed font-medium">${art.text}</p>

                                    ${(art.explanation || art.example) ? `
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs pt-2">
                                            ${art.explanation ? `<div class="bg-white p-2.5 rounded-lg border border-gray-200"><strong>💡 الشرح القانوني:</strong> ${art.explanation}</div>` : ''}
                                            ${art.example ? `<div class="bg-white p-2.5 rounded-lg border border-gray-200"><strong>📝 مثال تطبيقي:</strong> ${art.example}</div>` : ''}
                                        </div>
                                    ` : ''}

                                    <div class="space-y-1.5 pt-2">
                                        ${art.circulars && art.circulars.length > 0 ? `
                                            <div class="text-xs bg-emerald-50/60 p-2 rounded-lg border border-emerald-900/10 text-emerald-900">
                                                <strong>📢 اللوائح والتعاميم:</strong> ${art.circulars.join(' | ')}
                                            </div>
                                        ` : ''}
                                        ${art.judgments && art.judgments.length > 0 ? `
                                            <div class="text-xs bg-amber-50/60 p-2 rounded-lg border border-amber-900/10 text-amber-950">
                                                <strong>⚖️ السوابق القضائية:</strong> ${art.judgments.join(' | ')}
                                            </div>
                                        ` : ''}
                                    </div>
                                </div>
                            `;
                        });
                    }

                    sysCard.innerHTML = `
                        <div class="flex justify-between items-start border-b pb-3">
                            <div>
                                <span class="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-lg font-bold">${sys.status}</span>
                                <h3 class="text-xl font-black text-emerald-950 mt-1">${sys.name}</h3>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="openEditSystemModal(${sys.id})" class="text-xs bg-gold-500/20 hover:bg-gold-500/30 text-emerald-950 px-3 py-1.5 rounded-lg font-bold border border-gold-500/40">✏️ تعديل النظام</button>
                                <button onclick="deleteSystem(${sys.id})" class="text-red-500 hover:text-red-700 text-xs font-bold px-2 py-1">حذف النظام</button>
                            </div>
                        </div>
                        <div class="space-y-3">
                            ${articlesHTML}
                        </div>
                    `;
                    systemsGrid.appendChild(sysCard);
                });

                groupWrapper.innerHTML = groupHeader;
                groupWrapper.appendChild(systemsGrid);
                container.appendChild(groupWrapper);
            }
            updateDropdown();
        }

        // System Modals
        function openNewSystemModal() {
            document.getElementById('editSysId').value = '';
            document.getElementById('sysModalTitle').innerText = 'إضافة نظام أو مجموعة مبادئ جديدة';
            document.getElementById('sysName').value = '';
            document.getElementById('sysField').value = '';
            document.getElementById('newSystemModal').classList.remove('hidden');
        }
        function openEditSystemModal(id) {
            let sys = db.find(s => s.id === id);
            if (!sys) return;
            document.getElementById('editSysId').value = sys.id;
            document.getElementById('sysModalTitle').innerText = 'تعديل بيانات النظام';
            document.getElementById('sysName').value = sys.name;
            document.getElementById('sysField').value = sys.field;
            document.getElementById('sysStatus').value = sys.status;
            document.getElementById('newSystemModal').classList.remove('hidden');
        }
        function closeNewSystemModal() { document.getElementById('newSystemModal').classList.add('hidden'); }

        function saveSystem() {
            let editId = document.getElementById('editSysId').value;
            let name = document.getElementById('sysName').value.trim();
            let field = document.getElementById('sysField').value.trim() || "أنظمة عامة";
            let status = document.getElementById('sysStatus').value;
            if (!name) return alert('أدخل اسم النظام');

            if (editId) {
                let sys = db.find(s => s.id == editId);
                if (sys) {
                    sys.name = name;
                    sys.field = field;
                    sys.status = status;
                }
            } else {
                db.push({ id: Date.now(), name, field, status, articles: [] });
            }
            saveData();
            closeNewSystemModal();
        }

        // Article Modals
        function openContentModal() {
            document.getElementById('editArtIndex').value = '';
            document.getElementById('artModalTitle').innerText = 'إضافة مادة أو سابقة قضائية';
            document.getElementById('artNumber').value = '';
            document.getElementById('artText').value = '';
            document.getElementById('artExplanation').value = '';
            document.getElementById('artExample').value = '';
            document.getElementById('artCrossLinks').value = '';
            document.getElementById('artCirculars').value = '';
            document.getElementById('artJudgments').value = '';
            document.getElementById('contentModal').classList.remove('hidden');
        }
        function openEditArticleModal(sysId, artIndex) {
            let sys = db.find(s => s.id === sysId);
            if (!sys || !sys.articles[artIndex]) return;
            let art = sys.articles[artIndex];

            document.getElementById('editArtIndex').value = `${sysId}_${artIndex}`;
            document.getElementById('artModalTitle').innerText = 'تعديل المادة أو المبدأ';
            document.getElementById('contentSysId').value = sysId;
            document.getElementById('artNumber').value = art.number;
            document.getElementById('artText').value = art.text;
            document.getElementById('artExplanation').value = art.explanation || '';
            document.getElementById('artExample').value = art.example || '';
            document.getElementById('artCrossLinks').value = art.crossLinks || '';
            document.getElementById('artCirculars').value = art.circulars ? art.circulars.join(' | ') : '';
            document.getElementById('artJudgments').value = art.judgments ? art.judgments.join(' | ') : '';

            document.getElementById('contentModal').classList.remove('hidden');
        }
        function closeContentModal() { document.getElementById('contentModal').classList.add('hidden'); }

        function saveArticle() {
            let editIndexVal = document.getElementById('editArtIndex').value;
            let sysId = Number(document.getElementById('contentSysId').value);
            let number = document.getElementById('artNumber').value.trim();
            let text = document.getElementById('artText').value.trim();
            let explanation = document.getElementById('artExplanation').value.trim();
            let example = document.getElementById('artExample').value.trim();
            let crossLinks = document.getElementById('artCrossLinks').value.trim();
            
            let circularsRaw = document.getElementById('artCirculars').value.trim();
            let judgmentsRaw = document.getElementById('artJudgments').value.trim();
            let circulars = circularsRaw ? circularsRaw.split('|').map(s => s.trim()) : [];
            let judgments = judgmentsRaw ? judgmentsRaw.split('|').map(s => s.trim()) : [];

            if (!number || !text) return alert('أدخل رقم المادة ونصها');
            
            let sys = db.find(s => s.id === sysId);
            if (!sys) return;

            if (editIndexVal) {
                let parts = editIndexVal.split('_');
                let oldSysId = Number(parts[0]);
                let oldArtIdx = Number(parts[1]);
                let oldSys = db.find(s => s.id === oldSysId);

                let updatedArt = { number, text, explanation, example, crossLinks, circulars, judgments };

                if (oldSysId === sysId) {
                    oldSys.articles[oldArtIdx] = updatedArt;
                } else {
                    oldSys.articles.splice(oldArtIdx, 1);
                    sys.articles.push(updatedArt);
                }
            } else {
                sys.articles.push({ number, text, explanation, example, crossLinks, circulars, judgments });
            }
            saveData();
            closeContentModal();
        }

        function deleteSystem(id) {
            if (confirm('حذف هذا النظام بكافة مواده؟')) {
                db = db.filter(s => s.id !== id);
                saveData();
            }
        }

        function deleteArticle(sysId, artIndex) {
            if (confirm('حذف هذه المادة؟')) {
                let sys = db.find(s => s.id === sysId);
                if (sys) {
                    sys.articles.splice(artIndex, 1);
                    saveData();
                }
            }
        }

        function updateDropdown() {
            let sel = document.getElementById('contentSysId');
            sel.innerHTML = '';
            db.forEach(sys => {
                let opt = document.createElement('option');
                opt.value = sys.id;
                opt.innerText = `${sys.name} (${sys.field})`;
                sel.appendChild(opt);
            });
        }

        renderAll();
    </script>
</body>
</html>
