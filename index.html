<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مَرْجِع | قاعدة البيانات القانونية السعودية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            900: '#153E35',
                            950: '#0F2E27',
                            800: '#1C4F44',
                        },
                        gold: {
                            500: '#D4AF37',
                            400: '#E6CA65',
                            650: '#AA8C2C'
                        },
                        cream: '#FAF9F6',
                        paper: '#F4F1EA'
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #FAF9F6; color: #1F2937; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-cream">

    <!-- Header / Navbar -->
    <header class="bg-emerald-950 border-b-2 border-gold-500 shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 space-x-reverse cursor-pointer" onclick="navigateHome()">
                <div class="w-12 h-12 rounded-full border-2 border-gold-500 overflow-hidden flex items-center justify-center bg-emerald-900 shadow-md">
                    <svg viewBox="0 0 24 24" class="w-8 h-8 text-gold-400 fill-current" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5zm0 2.18l7 3.82v5c0 4.52-2.98 8.69-7 9.82-4.02-1.13-7-5.3-7-9.82v-5l7-3.82zM11 10h2v6h-2v-6zm0-3h2v2h-2V7z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-gold-400 tracking-wider">مَرْجِع</h1>
                    <p class="text-xs text-emerald-200">قاعدة البيانات القانونية السعودية</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2 sm:space-x-3 space-x-reverse">
                <button onclick="openCategoryModal()" class="bg-gold-500 hover:bg-gold-400 text-emerald-950 font-bold px-3 py-2 rounded-xl text-xs shadow-md transition">
                    + تصنيف
                </button>
                <button onclick="openSystemModal()" class="bg-emerald-800 hover:bg-emerald-700 text-gold-400 border border-gold-500/40 px-3 py-2 rounded-xl text-xs shadow-md transition">
                    + نظام
                </button>
                <button onclick="openArticleModal()" class="bg-emerald-900 hover:bg-emerald-800 text-gold-300 border border-gold-500/30 px-3 py-2 rounded-xl text-xs shadow-md transition">
                    + مادة وبحث
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

        <!-- Navigation Breadcrumbs -->
        <div id="breadcrumbBar" class="hidden items-center gap-2 bg-white px-4 py-3 rounded-xl border border-gold-500/30 shadow-sm text-xs font-bold text-emerald-950">
            <span class="cursor-pointer text-gold-600 hover:underline" onclick="navigateHome()">الرئيسية</span>
            <span id="breadcrumbCategory" class="hidden items-center gap-2">
                <span>/</span>
                <span id="bcCategoryText" class="cursor-pointer text-gold-600 hover:underline"></span>
            </span>
            <span id="breadcrumbSystem" class="hidden items-center gap-2">
                <span>/</span>
                <span id="bcSystemText" class="text-emerald-900"></span>
            </span>
        </div>

        <!-- Search Bar -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gold-500/20">
            <div class="relative">
                <input type="text" id="searchInput" oninput="render()" placeholder="ابحث في التصنيفات، الأنظمة، نص المادة، الشرح، التعاميم، أو السوابق القضائية..." class="w-full bg-paper border border-gold-500/30 text-emerald-950 placeholder-emerald-900/40 text-sm rounded-xl px-4 py-3.5 pr-10 focus:outline-none focus:ring-2 focus:ring-gold-500">
                <span class="absolute right-3.5 top-4 text-gold-600">🔍</span>
            </div>
        </div>

        <!-- Dynamic Container -->
        <div id="appContainer"></div>

    </main>

    <!-- Footer -->
    <footer class="bg-emerald-950 border-t border-gold-500/30 text-emerald-300 py-6 text-center text-xs mt-auto">
        <p>منصة مَرْجِع القانونية © 2026 - نظام إدارة المعلومات القضائية السعودية</p>
    </footer>

    <!-- Modal: Category (Add/Edit) -->
    <div id="categoryModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 border border-gold-500/30 shadow-2xl">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="catModalTitle" class="font-bold text-emerald-950 text-base">إضافة تصنيف رئيسي جديد</h3>
                <button onclick="closeCategoryModal()" class="text-gray-400 hover:text-gray-600">✕</button>
            </div>
            <input type="hidden" id="editCatId" value="">
            <div>
                <label class="block text-xs font-bold text-emerald-900 mb-1">اسم التصنيف</label>
                <input type="text" id="catNameInput" placeholder="مثال: الأنظمة التجارية" class="w-full bg-paper border border-gray-300 rounded-xl px-3 py-2 text-sm">
            </div>
            <div class="flex justify-end space-x-2 space-x-reverse pt-3 border-t">
                <button onclick="closeCategoryModal()" class="px-4 py-2 bg-gray-100 text-gray-700 text-xs rounded-xl">إلغاء</button>
                <button onclick="saveCategory()" class="px-4 py-2 bg-gold-500 text-emerald-950 font-bold text-xs rounded-xl">حفظ التصنيف</button>
            </div>
        </div>
    </div>

    <!-- Modal: System (Add/Edit) -->
    <div id="systemModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 border border-gold-500/30 shadow-2xl">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="sysModalTitle" class="font-bold text-emerald-950 text-base">إضافة نظام جديد</h3>
                <button onclick="closeSystemModal()" class="text-gray-400 hover:text-gray-600">✕</button>
            </div>
            <input type="hidden" id="editSysId" value="">
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-emerald-900 mb-1">اختر التصنيف الرئيسي</label>
                    <select id="sysCatSelect" class="w-full bg-paper border border-gray-300 rounded-xl px-3 py-2 text-sm"></select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-emerald-900 mb-1">اسم النظام</label>
                    <input type="text" id="sysNameInput" placeholder="مثال: نظام المحاكم التجارية" class="w-full bg-paper border border-gray-300 rounded-xl px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-emerald-900 mb-1">الحالة</label>
                    <select id="sysStatusInput" class="w-full bg-paper border border-gray-300 rounded-xl px-3 py-2 text-sm">
                        <option value="ساري">ساري</option>
                        <option value="معتمد كسابقة">معتمد كسابقة قضائية</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end space-x-2 space-x-reverse pt-3 border-t">
                <button onclick="closeSystemModal()" class="px-4 py-2 bg-gray-100 text-gray-700 text-xs rounded-xl">إلغاء</button>
                <button onclick="saveSystem()" class="px-4 py-2 bg-gold-500 text-emerald-950 font-bold text-xs rounded-xl">حفظ النظام</button>
            </div>
        </div>
    </div>

    <!-- Modal: Article (Add/Edit) -->
    <div id="articleModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full p-6 space-y-4 border border-gold-500/30 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="artModalTitle" class="font-bold text-emerald-950 text-base">إضافة مادة أو مبدأ جديد</h3>
                <button onclick="closeArticleModal()" class="text-gray-400 hover:text-gray-600">✕</button>
            </div>
            <input type="hidden" id="editArtIndex" value="">
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-emerald-900 mb-1">اختر النظام التابع له المادة</label>
                    <select id="artSysSelect" class="w-full bg-paper border border-gray-300 rounded-xl px-3 py-2 text-sm"></select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-emerald-900 mb-1">رقم المادة</label>
                        <input type="text" id="artNumberInput" placeholder="مثال: المادة 1" class="w-full bg-paper border border-gray-300 rounded-xl px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-emerald-900 mb-1">المواد المرتبطة (اختياري)</label>
                        <input type="text" id="artCrossInput" placeholder="مثال: المادة 5" class="w-full bg-paper border border-gray-300 rounded-xl px-3 py-2 text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-emerald-900 mb-1">نص المادة أو قاعدة المبدأ</label>
                    <textarea id="artTextInput" rows="3" placeholder="النص القانوني..." class="w-full bg-paper border border-gray-300 rounded-xl px-3 py-2 text-sm"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 bg-emerald-50/50 p-3 rounded-xl border border-emerald-900/10">
                    <div>
                        <label class="block text-xs font-bold text-emerald-900 mb-1">الشرح القانوني (اختياري)</label>
                        <textarea id="artExpInput" rows="2" placeholder="تفسير المادة..." class="w-full bg-white border border-gray-300 rounded-xl px-3 py-2 text-sm"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-emerald-900 mb-1">مثال تطبيقي (اختياري)</label>
                        <textarea id="artExInput" rows="2" placeholder="مثال عملي..." class="w-full bg-white border border-gray-300 rounded-xl px-3 py-2 text-sm"></textarea>
                    </div>
                </div>

                <div class="space-y-3 bg-paper p-3 rounded-xl border border-gold-500/20">
                    <div>
                        <label class="block text-xs font-bold text-emerald-900 mb-1">اللائحة والتعاميم (افصلي بـ | للتعدد)</label>
                        <input type="text" id="artCircInput" placeholder="اللائحة التنفيذية | تعميم رقم..." class="w-full bg-white border border-gray-300 rounded-xl px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-emerald-900 mb-1">السوابق القضائية (افصلي بـ | للتعدد)</label>
                        <input type="text" id="artJudgeInput" placeholder="مبدأ محكمة عليا..." class="w-full bg-white border border-gray-300 rounded-xl px-3 py-2 text-sm">
                    </div>
                </div>
            </div>
            <div class="flex justify-end space-x-2 space-x-reverse pt-3 border-t">
                <button onclick="closeArticleModal()" class="px-4 py-2 bg-gray-100 text-gray-700 text-xs rounded-xl">إلغاء</button>
                <button onclick="saveArticle()" class="px-4 py-2 bg-gold-500 text-emerald-950 font-bold text-xs rounded-xl">حفظ المادة</button>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        let db = JSON.parse(localStorage.getItem('marja_full_complete_db')) || [
            {
                id: 1,
                name: "الأنظمة التجارية",
                systems: [
                    {
                        id: 101,
                        name: "نظام المحاكم التجارية",
                        status: "ساري",
                        articles: [
                            {
                                number: "المادة 2",
                                text: "تطبق المحاكم التجارية أحكام الأنظمة التجارية، وما لم يوجد نص تطبيق أحكام الشريعة...",
                                explanation: "تحديد مرجعية التطبيق القضائي التجاري.",
                                example: "الرجوع للعرف التجاري عند غياب النص.",
                                crossLinks: "المادة 1",
                                circulars: ["اللائحة التنفيذية للمحاكم التجارية"],
                                judgments: ["مبدأ المحكمة العليا: العبرة بالقصود المعنوية"]
                            },
                            {
                                number: "المادة 1",
                                text: "تختص المحاكم التجارية بالنظر في المنازعات التي تنشأ بين التجار...",
                                explanation: "نطاق الاختصاص النوعي.",
                                example: "نزاع بين شركتين.",
                                crossLinks: "",
                                circulars: ["تعميم رقم 5"],
                                judgments: []
                            }
                        ]
                    }
                ]
            }
        ];

        let currentCatId = null;
        let currentSysId = null;

        function saveData() {
            localStorage.setItem('marja_full_complete_db', JSON.stringify(db));
            render();
        }

        function navigateHome() {
            currentCatId = null;
            currentSysId = null;
            render();
        }

        function navigateCategory(catId) {
            currentCatId = catId;
            currentSysId = null;
            render();
        }

        function navigateSystem(sysId) {
            currentSysId = sysId;
            render();
        }

        function extractNumber(str) {
            let match = str.match(/\d+/);
            return match ? parseInt(match[0], 10) : 999999;
        }

        function render() {
            const container = document.getElementById('appContainer');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const breadcrumbBar = document.getElementById('breadcrumbBar');
            const bcCat = document.getElementById('breadcrumbCategory');
            const bcSys = document.getElementById('breadcrumbSystem');

            updateDropdowns();

            if (currentCatId === null && currentSysId === null) {
                breadcrumbBar.classList.add('hidden');
                breadcrumbBar.classList.remove('flex');
            } else {
                breadcrumbBar.classList.remove('hidden');
                breadcrumbBar.classList.add('flex');
                let cat = db.find(c => c.id === currentCatId);
                if (cat) {
                    bcCat.classList.remove('hidden');
                    bcCat.classList.add('flex');
                    document.getElementById('bcCategoryText').innerText = cat.name;
                    document.getElementById('bcCategoryText').setAttribute('onclick', `navigateCategory(${cat.id})`);
                } else {
                    bcCat.classList.add('hidden');
                }

                if (currentSysId !== null && cat) {
                    let sys = cat.systems.find(s => s.id === currentSysId);
                    if (sys) {
                        bcSys.classList.remove('hidden');
                        bcSys.classList.add('flex');
                        document.getElementById('bcSystemText').innerText = sys.name;
                    } else {
                        bcSys.classList.add('hidden');
                    }
                } else {
                    bcSys.classList.add('hidden');
                }
            }

            // LEVEL 3: Articles View
            if (currentSysId !== null && currentCatId !== null) {
                let cat = db.find(c => c.id === currentCatId);
                let sys = cat ? cat.systems.find(s => s.id === currentSysId) : null;
                if (!sys) { navigateHome(); return; }

                let sortedArticles = [...sys.articles].map((art, originalIndex) => ({ ...art, originalIndex }))
                    .sort((a, b) => extractNumber(a.number) - extractNumber(b.number));

                if (searchVal) {
                    sortedArticles = sortedArticles.filter(art => 
                        art.number.toLowerCase().includes(searchVal) || 
                        art.text.toLowerCase().includes(searchVal) || 
                        (art.explanation && art.explanation.toLowerCase().includes(searchVal)) ||
                        (art.example && art.example.toLowerCase().includes(searchVal)) ||
                        (art.crossLinks && art.crossLinks.toLowerCase().includes(searchVal)) ||
                        art.circulars.some(c => c.toLowerCase().includes(searchVal)) ||
                        art.judgments.some(j => j.toLowerCase().includes(searchVal))
                    );
                }

                let articlesHTML = '';
                if (sortedArticles.length === 0) {
                    articlesHTML = `<div class="text-center py-12 text-gray-400 bg-white rounded-2xl border border-dashed border-gray-300 text-xs">لا توجد مواد مسجلة أو مطابقة داخل هذا النظام</div>`;
                } else {
                    sortedArticles.forEach(art => {
                        articlesHTML += `
                            <div class="bg-paper p-5 rounded-2xl border-r-4 border-emerald-800 space-y-3 shadow-sm">
                                <div class="flex justify-between items-center border-b pb-2 border-gold-500/20">
                                    <span class="font-black text-emerald-950 text-base">📜 ${art.number}</span>
                                    <div class="flex items-center gap-2">
                                        ${art.crossLinks ? `<span class="text-xs bg-gold-500/20 text-emerald-950 px-2.5 py-1 rounded-lg border border-gold-500/30">🔗 ارتباط: ${art.crossLinks}</span>` : ''}
                                        <button onclick="openEditArticleModal(${sys.id}, ${art.originalIndex})" class="text-xs bg-emerald-100 hover:bg-emerald-200 text-emerald-900 px-2.5 py-1 rounded-lg font-bold">✏️ تعديل</button>
                                        <button onclick="deleteArticle(${sys.id}, ${art.originalIndex})" class="text-xs bg-red-100 hover:bg-red-200 text-red-700 px-2.5 py-1 rounded-lg font-bold">حذف</button>
                                    </div>
                                </div>
                                <p class="text-xs sm:text-sm text-gray-800 leading-relaxed font-medium">${art.text}</p>
                                
                                ${(art.explanation || art.example) ? `
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs pt-2">
                                        ${art.explanation ? `<div class="bg-white p-3 rounded-xl border border-gray-200"><strong>💡 الشرح القانوني:</strong> ${art.explanation}</div>` : ''}
                                        ${art.example ? `<div class="bg-white p-3 rounded-xl border border-gray-200"><strong>📝 مثال تطبيقي:</strong> ${art.example}</div>` : ''}
                                    </div>
                                ` : ''}

                                <div class="space-y-1.5 pt-2">
                                    ${art.circulars && art.circulars.length > 0 ? `<div class="text-xs bg-emerald-50/60 p-2.5 rounded-xl border border-emerald-900/10 text-emerald-900"><strong>📢 اللوائح والتعاميم:</strong> ${art.circulars.join(' | ')}</div>` : ''}
                                    ${art.judgments && art.judgments.length > 0 ? `<div class="text-xs bg-amber-50/60 p-2.5 rounded-xl border border-amber-900/10 text-amber-950"><strong>⚖️ السوابق القضائية:</strong> ${art.judgments.join(' | ')}</div>` : ''}
                                </div>
                            </div>
                        `;
                    });
                }

                container.innerHTML = `
                    <div class="bg-white rounded-3xl border border-gold-500/40 shadow-md p-6 sm:p-8 space-y-6">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b pb-4 gap-4">
                            <div>
                                <span class="text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-lg font-bold">${sys.status}</span>
                                <h2 class="text-2xl font-black text-emerald-950 mt-1">${sys.name}</h2>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="openEditSystemModal(${sys.id})" class="text-xs bg-gold-500/20 text-emerald-950 px-3.5 py-2 rounded-xl font-bold border border-gold-500/40">✏️ تعديل النظام</button>
                                <button onclick="deleteSystem(${sys.id})" class="text-red-500 text-xs font-bold px-3 py-2 bg-red-50 rounded-xl">حذف النظام</button>
                            </div>
                        </div>
                        <div class="flex justify-between items-center">
                            <h3 class="text-sm font-black text-emerald-900">مواد ولوائح النظام:</h3>
                            <button onclick="openArticleModalPreselect(${sys.id})" class="bg-emerald-900 hover:bg-emerald-800 text-gold-400 text-xs font-bold px-3.5 py-2 rounded-xl">+ إضافة مادة لهذا النظام</button>
                        </div>
                        <div class="space-y-4">${articlesHTML}</div>
                    </div>
                `;
            } 
            // LEVEL 2: Systems View
            else if (currentCatId !== null) {
                let cat = db.find(c => c.id === currentCatId);
                if (!cat) { navigateHome(); return; }

                let filteredSystems = cat.systems.filter(s => 
                    s.name.toLowerCase().includes(searchVal) || 
                    s.articles.some(a => a.text.toLowerCase().includes(searchVal) || a.number.toLowerCase().includes(searchVal))
                );

                let systemsHTML = '';
                if (filteredSystems.length === 0) {
                    systemsHTML = `<div class="text-center py-12 text-gray-400 bg-white rounded-2xl border border-dashed border-gray-300 text-xs">لا توجد أنظمة تابعة لهذا التصنيف</div>`;
                } else {
                    systemsHTML = `<div class="grid grid-cols-1 md:grid-cols-2 gap-6">`;
                    filteredSystems.forEach(sys => {
                        systemsHTML += `
                            <div class="bg-white rounded-3xl border border-gold-500/30 shadow-sm p-6 flex flex-col justify-between space-y-4 hover:shadow-md transition">
                                <div class="space-y-2">
                                    <div class="flex justify-between items-center">
                                        <span class="text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-lg font-bold">${sys.status}</span>
                                        <span class="text-xs font-bold text-gold-600 bg-gold-500/10 px-2.5 py-1 rounded-lg border border-gold-500/20">📚 ${sys.articles.length} مواد</span>
                                    </div>
                                    <h3 class="text-xl font-black text-emerald-950 pt-2 cursor-pointer hover:text-gold-600" onclick="navigateSystem(${sys.id})">${sys.name}</h3>
                                </div>
                                <div class="pt-4 border-t flex items-center justify-between">
                                    <button onclick="navigateSystem(${sys.id})" class="bg-emerald-950 hover:bg-emerald-900 text-gold-400 font-bold px-4 py-2 rounded-xl text-xs shadow transition">
                                        استعراض مواده 📖
                                    </button>
                                    <div class="flex items-center gap-1">
                                        <button onclick="openEditSystemModal(${sys.id})" class="p-2 text-gray-600 bg-gray-100 rounded-xl text-xs font-bold" title="تعديل">✏️</button>
                                        <button onclick="deleteSystem(${sys.id})" class="p-2 text-red-500 bg-red-50 rounded-xl text-xs font-bold" title="حذف">🗑️</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    systemsHTML += `</div>`;
                }

                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="bg-white p-6 rounded-3xl border border-gold-500/30 flex justify-between items-center shadow-sm">
                            <div>
                                <span class="text-xs text-gray-500 font-bold">تصنيف رئيسي</span>
                                <h2 class="text-2xl font-black text-emerald-950">${cat.name}</h2>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="openEditCategoryModal(${cat.id})" class="text-xs bg-gold-500/20 text-emerald-950 px-3.5 py-2 rounded-xl font-bold border border-gold-500/40">✏️ تعديل التصنيف</button>
                                <button onclick="deleteCategory(${cat.id})" class="text-red-500 text-xs font-bold px-3 py-2 bg-red-50 rounded-xl">حذف</button>
                            </div>
                        </div>
                        <h3 class="text-sm font-black text-emerald-950">الأنظمة التابعة لهذا التصنيف:</h3>
                        ${systemsHTML}
                    </div>
                `;
            } 
            // LEVEL 1: Home View
            else {
                let filteredCats = db.filter(c => 
                    c.name.toLowerCase().includes(searchVal) || 
                    c.systems.some(s => s.name.toLowerCase().includes(searchVal) || s.articles.some(a => a.text.toLowerCase().includes(searchVal)))
                );

                if (filteredCats.length === 0) {
                    container.innerHTML = `<div class="text-center py-12 text-gray-400 bg-white rounded-2xl border border-dashed border-gray-300 text-xs">لا توجد تصنيفات مطابقة لبحثك</div>`;
                    return;
                }

                let gridHTML = `<div class="grid grid-cols-1 md:grid-cols-2 gap-6">`;
                filteredCats.forEach(cat => {
                    let totalArticles = cat.systems.reduce((acc, sys) => acc + sys.articles.length, 0);
                    gridHTML += `
                        <div class="bg-white rounded-3xl border border-gold-500/30 shadow-sm p-6 sm:p-7 flex flex-col justify-between space-y-4 hover:shadow-md transition">
                            <div class="space-y-2">
                                <div class="flex justify-between items-center">
                                    <span class="text-xs bg-gold-500/20 text-emerald-950 px-3 py-1 rounded-lg font-bold border border-gold-500/30">تصنيف رئيسي</span>
                                    <span class="text-xs font-bold text-gray-500">📁 ${cat.systems.length} أنظمة | 📜 ${totalArticles} مواد</span>
                                </div>
                                <h3 class="text-2xl font-black text-emerald-950 pt-3 cursor-pointer hover:text-gold-600" onclick="navigateCategory(${cat.id})">${cat.name}</h3>
                            </div>
                            <div class="pt-4 border-t flex items-center justify-between">
                                <button onclick="navigateCategory(${cat.id})" class="bg-emerald-950 hover:bg-emerald-900 text-gold-400 font-bold px-4 py-2.5 rounded-xl text-xs shadow transition flex items-center gap-1.5">
                                    <span>📂</span> استعراض الأنظمة بداخله
                                </button>
                                <div class="flex items-center gap-1">
                                    <button onclick="openEditCategoryModal(${cat.id})" class="p-2 text-gray-600 bg-gray-100 rounded-xl text-xs font-bold" title="تعديل">✏️</button>
                                    <button onclick="deleteCategory(${cat.id})" class="p-2 text-red-500 bg-red-50 rounded-xl text-xs font-bold" title="حذف">🗑️</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                gridHTML += `</div>`;
                container.innerHTML = gridHTML;
            }
        }

        // Category Modals
        function openCategoryModal() {
            document.getElementById('editCatId').value = '';
            document.getElementById('catModalTitle').innerText = 'إضافة تصنيف رئيسي جديد';
            document.getElementById('catNameInput').value = '';
            document.getElementById('categoryModal').classList.remove('hidden');
        }
        function openEditCategoryModal(id) {
            let cat = db.find(c => c.id === id);
            if (!cat) return;
            document.getElementById('editCatId').value = cat.id;
            document.getElementById('catModalTitle').innerText = 'تعديل اسم التصنيف الرئيسي';
            document.getElementById('catNameInput').value = cat.name;
            document.getElementById('categoryModal').classList.remove('hidden');
        }
        function closeCategoryModal() { document.getElementById('categoryModal').classList.add('hidden'); }
        function saveCategory() {
            let editId = document.getElementById('editCatId').value;
            let name = document.getElementById('catNameInput').value.trim();
            if (!name) return alert('أدخل اسم التصنيف');
            if (editId) {
                let cat = db.find(c => c.id == editId);
                if (cat) cat.name = name;
            } else {
                db.push({ id: Date.now(), name, systems: [] });
            }
            saveData();
            closeCategoryModal();
        }
        function deleteCategory(id) {
            if (confirm('حذف هذا التصنيف بكافة أنظمته ومواده؟')) {
                db = db.filter(c => c.id !== id);
                if (currentCatId === id) navigateHome();
                else saveData();
            }
        }

        // System Modals
        function openSystemModal() {
            document.getElementById('editSysId').value = '';
            document.getElementById('sysModalTitle').innerText = 'إضافة نظام جديد';
            document.getElementById('sysNameInput').value = '';
            if (currentCatId !== null) document.getElementById('sysCatSelect').value = currentCatId;
            document.getElementById('systemModal').classList.remove('hidden');
        }
        function openEditSystemModal(id) {
            let sys = null, foundCatId = null;
            db.forEach(c => {
                let s = c.systems.find(x => x.id === id);
                if (s) { sys = s; foundCatId = c.id; }
            });
            if (!sys) return;
            document.getElementById('editSysId').value = sys.id;
            document.getElementById('sysModalTitle').innerText = 'تعديل بيانات النظام';
            document.getElementById('sysCatSelect').value = foundCatId;
            document.getElementById('sysNameInput').value = sys.name;
            document.getElementById('sysStatusInput').value = sys.status;
            document.getElementById('systemModal').classList.remove('hidden');
        }
        function closeSystemModal() { document.getElementById('systemModal').classList.add('hidden'); }
        function saveSystem() {
            let editId = document.getElementById('editSysId').value;
            let catId = Number(document.getElementById('sysCatSelect').value);
            let name = document.getElementById('sysNameInput').value.trim();
            let status = document.getElementById('sysStatusInput').value;
            if (!name) return alert('أدخل اسم النظام');
            let cat = db.find(c => c.id === catId);
            if (!cat) return alert('اختر تصنيفاً صحيحاً');

            if (editId) {
                let oldSys = null, oldCat = null;
                db.forEach(c => {
                    let s = c.systems.find(x => x.id == editId);
                    if (s) { oldSys = s; oldCat = c; }
                });
                if (oldSys) {
                    oldSys.name = name;
                    oldSys.status = status;
                    if (oldCat.id !== catId) {
                        oldCat.systems = oldCat.systems.filter(x => x.id != editId);
                        cat.systems.push(oldSys);
                    }
                }
            } else {
                let newSys = { id: Date.now(), name, status, articles: [] };
                cat.systems.push(newSys);
                currentCatId = cat.id;
                currentSysId = newSys.id;
            }
            saveData();
            closeSystemModal();
        }
        function deleteSystem(id) {
            if (confirm('حذف هذا النظام بكافة مواده؟')) {
                db.forEach(c => {
                    c.systems = c.systems.filter(s => s.id !== id);
                });
                if (currentSysId === id) currentSysId = null;
                saveData();
            }
        }

        // Article Modals
        function openArticleModal() {
            document.getElementById('editArtIndex').value = '';
            document.getElementById('artModalTitle').innerText = 'إضافة مادة أو مبدأ جديد';
            if (currentSysId !== null) document.getElementById('artSysSelect').value = currentSysId;
            document.getElementById('artNumberInput').value = '';
            document.getElementById('artTextInput').value = '';
            document.getElementById('artExpInput').value = '';
            document.getElementById('artExInput').value = '';
            document.getElementById('artCrossInput').value = '';
            document.getElementById('artCircInput').value = '';
            document.getElementById('artJudgeInput').value = '';
            document.getElementById('articleModal').classList.remove('hidden');
        }
        function openArticleModalPreselect(sysId) {
            openArticleModal();
            document.getElementById('artSysSelect').value = sysId;
        }
        function openEditArticleModal(sysId, artIndex) {
            let sys = null;
            db.forEach(c => {
                let s = c.systems.find(x => x.id === sysId);
                if (s) sys = s;
            });
            if (!sys || !sys.articles[artIndex]) return;
            let art = sys.articles[artIndex];

            document.getElementById('editArtIndex').value = `${sysId}_${artIndex}`;
            document.getElementById('artModalTitle').innerText = 'تعديل المادة أو المبدأ';
            document.getElementById('artSysSelect').value = sysId;
            document.getElementById('artNumberInput').value = art.number;
            document.getElementById('artTextInput').value = art.text;
            document.getElementById('artExpInput').value = art.explanation || '';
            document.getElementById('artExInput').value = art.example || '';
            document.getElementById('artCrossInput').value = art.crossLinks || '';
            document.getElementById('artCircInput').value = art.circulars ? art.circulars.join(' | ') : '';
            document.getElementById('artJudgeInput').value = art.judgments ? art.judgments.join(' | ') : '';
            document.getElementById('articleModal').classList.remove('hidden');
        }
        function closeArticleModal() { document.getElementById('articleModal').classList.add('hidden'); }
        function saveArticle() {
            let editIndexVal = document.getElementById('editArtIndex').value;
            let sysId = Number(document.getElementById('artSysSelect').value);
            let number = document.getElementById('artNumberInput').value.trim();
            let text = document.getElementById('artTextInput').value.trim();
            let explanation = document.getElementById('artExpInput').value.trim();
            let example = document.getElementById('artExInput').value.trim();
            let crossLinks = document.getElementById('artCrossInput').value.trim();
            let circRaw = document.getElementById('artCircInput').value.trim();
            let judgeRaw = document.getElementById('artJudgeInput').value.trim();
            let circulars = circRaw ? circRaw.split('|').map(s => s.trim()) : [];
            let judgments = judgeRaw ? judgeRaw.split('|').map(s => s.trim()) : [];

            if (!number || !text) return alert('أدخل رقم المادة ونصها');

            let targetSys = null;
            db.forEach(c => {
                let s = c.systems.find(x => x.id === sysId);
                if (s) targetSys = s;
            });
            if (!targetSys) return alert('اختر نظاماً صحيحاً');

            let newArt = { number, text, explanation, example, crossLinks, circulars, judgments };

            if (editIndexVal) {
                let parts = editIndexVal.split('_');
                let oldSysId = Number(parts[0]);
                let oldArtIdx = Number(parts[1]);
                let oldSys = null;
                db.forEach(c => {
                    let s = c.systems.find(x => x.id === oldSysId);
                    if (s) oldSys = s;
                });

                if (oldSysId === sysId) {
                    oldSys.articles[oldArtIdx] = newArt;
                } else {
                    oldSys.articles.splice(oldArtIdx, 1);
                    targetSys.articles.push(newArt);
                }
            } else {
                targetSys.articles.push(newArt);
            }
            saveData();
            closeArticleModal();
        }
        function deleteArticle(sysId, artIndex) {
            if (confirm('حذف هذه المادة؟')) {
                db.forEach(c => {
                    let s = c.systems.find(x => x.id === sysId);
                    if (s) s.articles.splice(artIndex, 1);
                });
                saveData();
            }
        }

        function updateDropdowns() {
            let catSel = document.getElementById('sysCatSelect');
            let artSysSel = document.getElementById('artSysSelect');
            if (catSel) {
                catSel.innerHTML = '';
                db.forEach(c => {
                    let opt = document.createElement('option');
                    opt.value = c.id;
                    opt.innerText = c.name;
                    catSel.appendChild(opt);
                });
            }
            if (artSysSel) {
                artSysSel.innerHTML = '';
                db.forEach(c => {
                    c.systems.forEach(s => {
                        let opt = document.createElement('option');
                        opt.value = s.id;
                        opt.innerText = `${c.name} > ${s.name}`;
                        artSysSel.appendChild(opt);
                    });
                });
            }
        }

        render();
    </script>
</body>
</html>
